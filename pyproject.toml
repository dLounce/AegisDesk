[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegisdesk"
version = "0.0.1"
description = "Multi-agent IT and access operations with a deterministic, human-gated security control plane"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.4",
    "langchain-core==1.5.4",
    "langchain-openai==1.4.3",
    "langchain-groq==1.1.3",
    "fastapi==0.141.1",
    "uvicorn==0.41.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.1",
    "httpx==0.28.1",
    "ruff==0.15.3",
    "mypy==1.19.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegisdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls a real model provider; excluded from the default run",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true

# The langchain packages are a heavy, deeply-typed dependency used only behind the live-model
# transport adapter. We do not type-check their internals; our own code treats the client
# structurally (ChatClient) and never depends on langchain types leaking outward.
[[tool.mypy.overrides]]
module = ["langchain_openai.*", "langchain_core.*"]
follow_imports = "skip"
ignore_missing_imports = true
